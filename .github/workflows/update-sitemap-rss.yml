name: Aktualizovat sitemap a RSS

on:
  push:
    branches:
      - main
    paths:
      - "clanek/**/index.html"
      - "scripts/update-site-indexes.mjs"
      - ".github/workflows/update-sitemap-rss.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site-indexes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vygenerovat manifest, sitemap a RSS
        run: node scripts/update-site-indexes.mjs

      - name: Uložit změny zpět do repozitáře
        shell: bash
        run: |
          if git diff --quiet -- assets/data/articles.json sitemap.xml rss.xml; then
            echo "Není co aktualizovat."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/articles.json sitemap.xml rss.xml
          git commit -m "Auto: aktualizace blog indexů [skip ci]"
          git push

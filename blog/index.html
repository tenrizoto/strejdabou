<script>
(function(){
  const view=document.getElementById('blogView');
  if(!view) return;

  const clean=s=>(s||'').replace(/\s+/g,' ').trim();
  const categorySelectors=[
    '.blog-item-category','.blog-card-category','.blog-post-category','.blog-category',
    '[data-category]','[class*="category"]'
  ];

  function findSummaryTextNode(){
    const walker=document.createTreeWalker(view,NodeFilter.SHOW_TEXT);
    let n;
    while(n=walker.nextNode()){
      if(/\d+\s*článků\s*·\s*\d+\s*štítků\s*·\s*\d+\s*min\s*čtení/i.test(clean(n.nodeValue))) return n;
    }
    return null;
  }

  function collectCategories(){
    const found=[];
    view.querySelectorAll(categorySelectors.join(',')).forEach(el=>{
      const value=clean(el.getAttribute('data-category')||el.textContent);
      if(!value || /článků|štítků|min čtení|rss/i.test(value)) return;
      if(value.length>80) return;
      found.push({name:value,el});
    });
    const map=new Map();
    found.forEach(item=>{
      if(!map.has(item.name)) map.set(item.name,[]);
      map.get(item.name).push(item.el);
    });
    return map;
  }

  function articleContainerForCategory(el){
    return el.closest('article,.blog-item,.blog-card,.blog-post,.blog-list-item,[class*="blog-item"],[class*="blog-card"],[class*="blog-post"]') || el.closest('a');
  }

  function init(){
    if(view.dataset.tagUiReady==='1') return true;
    const textNode=findSummaryTextNode();
    const categories=collectCategories();
    if(!textNode || !categories.size) return false;

    const raw=clean(textNode.nodeValue);
    const m=raw.match(/^(.*?)?(\d+)\s*článků\s*·\s*(\d+)\s*štítků\s*·\s*(\d+)\s*min\s*čtení(.*)$/i);
    if(!m) return false;

    const before=m[1]||'';
    const articles=m[2], tags=m[3], minutes=m[4], after=m[5]||'';
    const frag=document.createDocumentFragment();
    if(before) frag.append(document.createTextNode(before));
    frag.append(document.createTextNode(articles+' článků · '));
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='blog-tag-toggle';
    btn.setAttribute('aria-expanded','false');
    btn.setAttribute('aria-controls','blogTagPanel');
    btn.innerHTML=tags+' štítků <span class="blog-tag-arrow" aria-hidden="true">▼</span>';
    frag.append(btn);
    frag.append(document.createTextNode(' · '+minutes+' min čtení'+after));
    textNode.parentNode.replaceChild(frag,textNode);

    const panel=document.createElement('div');
    panel.id='blogTagPanel';
    panel.className='blog-tag-panel';
    panel.setAttribute('aria-label','Štítky článků');

    const allBtn=document.createElement('button');
    allBtn.type='button';
    allBtn.className='blog-tag-chip is-active';
    allBtn.textContent='Všechny';
    allBtn.dataset.filter='';
    panel.append(allBtn);

    [...categories.entries()].sort((a,b)=>a[0].localeCompare(b[0],'cs')).forEach(([name,els])=>{
      const chip=document.createElement('button');
      chip.type='button';
      chip.className='blog-tag-chip';
      chip.dataset.filter=name;
      chip.append(document.createTextNode(name));
      const count=document.createElement('span');
      count.className='blog-tag-chip-count';
      count.textContent=' '+els.length;
      chip.append(count);
      panel.append(chip);
    });

    const summaryHost=btn.closest('div,p,section')||btn.parentElement;
    summaryHost.insertAdjacentElement('afterend',panel);

    btn.addEventListener('click',()=>{
      const open=!panel.classList.contains('is-open');
      panel.classList.toggle('is-open',open);
      btn.setAttribute('aria-expanded',open?'true':'false');
    });

    const categoryToContainers=new Map();
    categories.forEach((els,name)=>{
      const set=new Set();
      els.forEach(el=>{ const c=articleContainerForCategory(el); if(c) set.add(c); });
      categoryToContainers.set(name,set);
    });
    const allContainers=new Set();
    categoryToContainers.forEach(set=>set.forEach(c=>allContainers.add(c)));

    panel.addEventListener('click',e=>{
      const chip=e.target.closest('.blog-tag-chip');
      if(!chip) return;
      panel.querySelectorAll('.blog-tag-chip').forEach(x=>x.classList.toggle('is-active',x===chip));
      const filter=chip.dataset.filter||'';
      allContainers.forEach(c=>{ c.style.display=''; });
      if(filter){
        const allowed=categoryToContainers.get(filter)||new Set();
        allContainers.forEach(c=>{ if(!allowed.has(c)) c.style.display='none'; });
      }
    });

    view.dataset.tagUiReady='1';
    return true;
  }

  if(!init()){
    const observer=new MutationObserver(()=>{ if(init()) observer.disconnect(); });
    observer.observe(view,{childList:true,subtree:true});
    setTimeout(()=>observer.disconnect(),10000);
  }
})();
</script>

<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>BOU/DEX — Pokémon TCG katalog</title>
<meta name="description" content="BOU/DEX: japonské i anglické Full Art Pokémon karty všech generací.">
<link rel="icon" href="https://bou.hradec.info/ptcg/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://bou.hradec.info/ptcg/assets/style.css?v=15">
<style>html,body{margin:0;min-height:100%;background:#0b1019;color:#f0f3f7}#boudexLoading{padding:38px 20px;text-align:center;font:16px system-ui,sans-serif;color:#c4cedf}#boudexLoading.error{color:#ffb6ad}#boudexLoading a{color:#f8be65}</style>
</head><body>
<div id="boudexRoot"><div id="boudexLoading" role="status">Načítám BOU/DEX…</div></div>
<script>
'use strict';
// GitHub Pages hosts only this loader. All HTML, CSS, JS, API and images live on bou.hradec.info.
(async function(){
  const origin='https://bou.hradec.info/ptcg/';
  const root=document.getElementById('boudexRoot');
  try{
    const r=await fetch(origin+'gallery_fragment.php',{mode:'cors',credentials:'omit',cache:'no-cache'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const markup=await r.text();
    if(!markup.includes('id="cards"')||!markup.includes('id="detail"'))throw new Error('Neplatná šablona galerie');
    root.innerHTML=markup;
    root.querySelectorAll('img[src^="assets/"]').forEach(img=>{img.src=origin+img.getAttribute('src');});
    window.BOUDEX_API_BASE=origin;
    const script=document.createElement('script');script.src=origin+'assets/app.js?v=15';script.defer=true;
    script.onerror=()=>{root.innerHTML='<div id="boudexLoading" class="error">Nepodařilo se načíst kód galerie. <a href="'+origin+'">Přejít na veřejnou galerii</a>.</div>';};
    document.body.appendChild(script);
  }catch(err){
    root.innerHTML='<div id="boudexLoading" class="error">Katalog se zatím nepodařilo propojit se serverem. <a href="'+origin+'">Otevřít BOU/DEX přímo</a>.<p style="font-size:13px">'+String(err.message).replace(/[<>]/g,'')+'</p></div>';
  }
})();
</script>
</body></html>
